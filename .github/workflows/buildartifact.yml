name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java (required for Android build tools)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Install Android SDK and tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Flutter (Flet uses Flutter under the hood)
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'   # you can use 'stable' or a specific version
          channel: 'stable'

      # 5. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 6. Install Flet with all extras (including build dependencies)
      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet[all]

      # 7. Build the Android APK (release mode)
      - name: Build Android APK
        run: |
          flet build android --release

      # 8. Locate and upload the generated APK
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnaf-launcher
          # Flet places the APK inside build/app/outputs/apk/release/
          # If the path differs, you can use a broader glob: build/**/*.apk
          path: build/app/outputs/apk/release/*.apk
          if-no-files-found: error   # fail if no APK found