name: Build Android APK (Manual)

on:
  workflow_dispatch:
    # Optional: add inputs for customizing the build
    inputs:
      build_type:
        description: 'Build type (release/debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java (required for Android build tools)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Install Android SDK and tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Flutter (Flet uses Flutter under the hood)
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 5. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 6. Install Flet with all extras (including build dependencies)
      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet[all] requests

      # 7. Build the Android APK
      - name: Build Android APK
        run: |
          if [ "${{ inputs.build_type }}" == "release" ]; then
            flet build apk --release
          else
            flet build apk
          fi

      # 8. Locate and upload the generated APK
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnaf-launcher-${{ inputs.build_type }}
          path: build/apk/*.apk
          if-no-files-found: error   # fail if no APK found

      # 9. Optional: List files for debugging
      - name: List generated files
        if: always()
        run: |
          echo "Generated APK files:"
          find build -name "*.apk" -type f
